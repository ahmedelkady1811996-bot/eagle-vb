<title>No connection — Kadysoft</title>

<style>
:root {
  --bg: #0a0e16;
  --stroke: rgba(255, 255, 255, 0.1);
  --txt: #eef2ff;
  --muted: #8b9bb8;
  --brand: #ff2e63;
  --brand-2: #ff7a45;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f0f4fb;
    --stroke: rgba(15, 23, 42, 0.09);
    --txt: #0f172a;
    --muted: #5b6b8c;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
  text-align: center;
}
.logo {
  width: 88px;
  height: 88px;
  border-radius: 22px;
  object-fit: cover;
  border: 2.5px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 12px 32px rgba(255, 46, 99, 0.28);
}
.brand {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: -4px;
}
h2 {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-top: 4px;
}
p {
  color: var(--muted);
  font-size: 0.95rem;
  line-height: 1.65;
  max-width: 320px;
  font-weight: 500;
}
button {
  margin-top: 10px;
  padding: 13px 28px;
  border: 0;
  border-radius: 13px;
  color: #fff;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 10px 28px rgba(255, 46, 99, 0.35);
  transition: transform 0.15s, box-shadow 0.2s;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 34px rgba(255, 46, 99, 0.45);
}
button:active { transform: scale(0.97); }
</style>
</head>
